name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ${{ format('root-{0}', github.run_id) }}
          MARIADB_DATABASE: MusicRoom
          MARIADB_USER: music_user
          MARIADB_PASSWORD: ${{ format('db-{0}', github.run_id) }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JWT_SECRET: ${{ format('jwt-{0}-{1}', github.run_id, github.sha) }}
      DB_PASS: ${{ format('db-{0}', github.run_id) }}
      DB_USER: music_user
      DB_PORT: 3306
      DB_HOST: 127.0.0.1
      DB_NAME: MusicRoom
      PUBLIC_URL: http://127.0.0.1:8080
      DEV: 'true'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build_app
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:integration

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=MUSIC_ROOM_SERVER=10.0.2.2:8080
      - run: flutter build web --release --dart-define=MUSIC_ROOM_SERVER=localhost:8080
